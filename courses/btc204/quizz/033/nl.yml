question: Als we bij een eenvoudige betalingstransactie waarnemen dat een output een rond bedrag heeft, welke waarschijnlijke interpretatie kunnen we hier dan uit trekken?
answer: De ronde output is niet langer in het bezit van de input-gebruiker.
wrong_answers:
  - De ronde output is bedoeld voor transactiekosten.
  - De ronde output behoort nog steeds toe aan de invoerende gebruiker.
  - De ronde output is een reserve adres.
explanation: |
  Bij een eenvoudig betalingspatroon (1 input en 2 outputs), als een van de outputs een rond bedrag uitgeeft, dan vertegenwoordigt deze de betaling en verlaat daarmee het bezit van de input-gebruiker.
reviewed: false
