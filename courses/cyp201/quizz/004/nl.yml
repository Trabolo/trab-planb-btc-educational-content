question: Welke combinatie van hashfuncties wordt gebruikt om kortere vingerafdrukken in Bitcoin te genereren?
answer: HASH160
wrong_answers:
  - SHA512-SHA256
  - HASH256
  - SHA160
explanation: |
  HASH160 combineert SHA256 en RIPEMD160 om 160-bits vingerafdrukken te genereren, met name voor Bitcoin-adressen.
reviewed: false
